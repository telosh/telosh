<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="apple-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#161618" />
    </linearGradient>
  </defs>

  <!-- Apple Rounded Surface Card -->
  <rect width="800" height="200" rx="18" fill="url(#apple-card-bg)" stroke="#2c2c2e" stroke-width="1.2" />

  <!-- Header Content Area -->
  <g transform="translate(48, 44)">
    <!-- Subtitle / Tag -->
    <text x="0" y="0" font-family="-apple-system, SF Pro Display, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#86868b" letter-spacing="1.5">ENGINEER PROFILE</text>

    <!-- Main Title -->
    <text x="0" y="44" font-family="-apple-system, SF Pro Display, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" fill="#f5f5f7" letter-spacing="-0.5">Terumi Kawano</text>

    <!-- Role Description -->
    <text x="0" y="74" font-family="-apple-system, SF Pro Text, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400" fill="#2997ff">Frontend &amp; Mobile Engineer  <tspan fill="#86868b">•</tspan>  Google Cloud Platform</text>

    <!-- Location & Bio -->
    <text x="0" y="104" font-family="-apple-system, SF Pro Text, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="400" fill="#86868b">Based in Japan. Focused on React Native, Next.js, and Cloud Infrastructure.</text>
  </g>
</svg>