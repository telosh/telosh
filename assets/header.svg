    <circle cx="16" cy="13" r="4" fill="#10b981" />
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">BUILDING OPEN SOURCE</text>
  </g>

  <text x="48" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">Terumi Kawano</text>
  <text x="48" y="128" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="2">@telosh • FULL-STACK &amp; CLOUD NATIVE ENGINEER</text>

  <text x="48" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">⚡ Architecting Edge Native Apps, High-Performance Web APIs &amp; AI Agents</text>

