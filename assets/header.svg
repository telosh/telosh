  </defs>

  <rect width="800" height="200" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  <rect width="800" height="200" rx="16" fill="url(#grid)" />

  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#border-grad)" />

  <g transform="translate(48, 34)">
