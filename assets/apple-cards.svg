<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
  </defs>

  <!-- Card 1: Frontend & Mobile Native -->
  <g transform="translate(0, 0)">
    <rect width="250" height="210" rx="18" fill="url(#card-bg)" stroke="#2c2c2e" stroke-width="1.2" />
    
    <!-- Title Section -->
    <text x="24" y="38" font-family="-apple-system, SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#86868b" letter-spacing="1">01 / FRONTEND &amp; MOBILE</text>
    <text x="24" y="66" font-family="-apple-system, SF Pro Display, sans-serif" font-size="17" font-weight="600" fill="#f5f5f7">React Native &amp; Web</text>
    <text x="24" y="88" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="400" fill="#86868b">Cross-platform engineering with Expo &amp; Next.js.</text>
    
    <line x1="24" y1="110" x2="226" y2="110" stroke="#2c2c2e" stroke-width="1" />
    
    <!-- Brand Icon Badges -->
    <g transform="translate(24, 128)">
      <!-- React Native Icon + Label -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="94" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><g fill="none" stroke="#61DAFB" stroke-width="1.5"><ellipse cx="12" cy="12" rx="10" ry="4.2"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="2" fill="#61DAFB"/></g></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">React Native</text>
      </g>

      <!-- Next.js Icon + Label -->
      <g transform="translate(102, 0)">
        <rect x="0" y="0" width="76" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#FFF" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5 17.5l-6.2-8.5v8.5H9V6.5h2l6 8.3V6.5h1.8v11z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">Next.js</text>
      </g>

      <!-- Tailwind Icon + Label -->
      <g transform="translate(0, 34)">
        <rect x="0" y="0" width="88" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#06B6D4" d="M12 4.5C7 4.5 3.7 7.5 2 12c2-2.5 4.2-3.5 6.5-3 1.3.3 2.2 1.2 3.3 2.3C13.6 13.1 15.8 15.5 22 15.5c5 0 8.3-3 10-7.5-2 2.5-4.2 3.5-6.5 3-1.3-.3-2.2-1.2-3.3-2.3C20.4 6.9 18.2 4.5 12 4.5z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">Tailwind</text>
      </g>
    </g>
  </g>

  <!-- Card 2: Google Cloud & Infra -->
  <g transform="translate(275, 0)">
    <rect width="250" height="210" rx="18" fill="url(#card-bg)" stroke="#2c2c2e" stroke-width="1.2" />
    
    <text x="24" y="38" font-family="-apple-system, SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#86868b" letter-spacing="1">02 / CLOUD PLATFORM</text>
    <text x="24" y="66" font-family="-apple-system, SF Pro Display, sans-serif" font-size="17" font-weight="600" fill="#f5f5f7">Google Cloud &amp; Edge</text>
    <text x="24" y="88" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="400" fill="#86868b">Serverless compute, APIs, and edge distribution.</text>
    
    <line x1="24" y1="110" x2="226" y2="110" stroke="#2c2c2e" stroke-width="1" />
    
    <!-- Brand Icon Badges -->
    <g transform="translate(24, 128)">
      <!-- GCP Icon + Label -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="102" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#4285F4" d="M19.3 9.6A7.5 7.5 0 0 0 12 4.5a7.5 7.5 0 0 0-7.3 5.8A5.5 5.5 0 0 0 0 15.5 5.5 5.5 0 0 0 5.5 21h13a4.5 4.5 0 0 0 4.5-4.5 4.5 4.5 0 0 0-3.7-6.9z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">Google Cloud</text>
      </g>

      <!-- Firebase Icon + Label -->
      <g transform="translate(110, 0)">
        <rect x="0" y="0" width="80" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#FFCA28" d="M3.9 15.8L7.6 1.8a.6.6 0 0 1 1.1-.1l2.5 4.8z"/><path fill="#FFA000" d="M13.6 8.3l2.1-4a.6.6 0 0 1 1.1 0l3.4 11.5z"/><path fill="#F57C00" d="M3.9 15.8l8.1-13.6a.6.6 0 0 1 1 0l2.6 6.1z"/><path fill="#FFCA28" d="M1.2 18.5l1.6-9.8a.6.6 0 0 1 1.1-.1l16.8 9.9a.6.6 0 0 1-.3 1.1H2.1a.9.9 0 0 1-.9-1.1z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">Firebase</text>
      </g>

      <!-- Cloudflare Icon + Label -->
      <g transform="translate(0, 34)">
        <rect x="0" y="0" width="94" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#F38020" d="M18 10a5 5 0 0 0-9.6-1.8A3.5 3.5 0 0 0 4 11.5 3.5 3.5 0 0 0 7.5 15h11a3.5 3.5 0 0 0 3.5-3.5A3.5 3.5 0 0 0 18 10z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">Cloudflare</text>
      </g>
    </g>
  </g>

  <!-- Card 3: Developer Tools & AI -->
  <g transform="translate(550, 0)">
    <rect width="250" height="210" rx="18" fill="url(#card-bg)" stroke="#2c2c2e" stroke-width="1.2" />
    
    <text x="24" y="38" font-family="-apple-system, SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#86868b" letter-spacing="1">03 / DEVELOPMENT</text>
    <text x="24" y="66" font-family="-apple-system, SF Pro Display, sans-serif" font-size="17" font-weight="600" fill="#f5f5f7">Languages &amp; Tools</text>
    <text x="24" y="88" font-family="-apple-system, SF Pro Text, sans-serif" font-size="12" font-weight="400" fill="#86868b">Modern editor tooling and automated AI workflows.</text>
    
    <line x1="24" y1="110" x2="226" y2="110" stroke="#2c2c2e" stroke-width="1" />
    
    <!-- Brand Icon Badges -->
    <g transform="translate(24, 128)">
      <!-- TypeScript Icon + Label -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="96" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#3178C6" d="M1.5 0h21A1.5 1.5 0 0 1 24 1.5v21a1.5 1.5 0 0 1-1.5 1.5h-21A1.5 1.5 0 0 1 0 22.5v-21A1.5 1.5 0 0 1 1.5 0z"/><path fill="#FFF" d="M13.7 18.3c.7.4 1.6.7 2.6.7 1.2 0 1.9-.6 1.9-1.4 0-.8-.6-1.3-2.1-1.9-2.1-.8-3.4-1.9-3.4-3.8 0-2.3 1.9-3.9 4.8-3.9 1.2 0 2.2.3 2.8.6l-.7 2.1c-.5-.3-1.3-.5-2.1-.5-1.1 0-1.7.5-1.7 1.2 0 .8.7 1.2 2.2 1.8 2.2.8 3.3 2 3.3 3.9 0 2.5-2 4-5.2 4-1.4 0-2.6-.3-3.3-.8l.9-2.1zM11.6 8.3v2.2H8.9v10.3H6.1V10.5H3.5V8.3h8.1z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">TypeScript</text>
      </g>

      <!-- Python Icon + Label -->
      <g transform="translate(104, 0)">
        <rect x="0" y="0" width="76" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#3776AB" d="M11.9 2c-5.2 0-4.9 2.2-4.9 2.2v2.3h5V8H4.7S2 7.7 2 12.9s2.4 5 2.4 5h1.4v-2c0-2.3 2-2.3 2-2.3h4.8c2.1 0 2.1-2 2.1-2V4.2S15.1 2 11.9 2zm-2.7 1.6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/><path fill="#FFD43B" d="M12.1 22c5.2 0 4.9-2.2 4.9-2.2v-2.3h-5V16h7.3s2.7.3 2.7-4.9-2.4-5-2.4-5h-1.4v2c0 2.3-2 2.3-2 2.3h-4.8c-2.1 0-2.1 2-2.1 2v7.4s-.4 2.2 2.8 2.2zm2.7-1.6a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">Python</text>
      </g>

      <!-- GitHub Icon + Label -->
      <g transform="translate(0, 34)">
        <rect x="0" y="0" width="80" height="26" rx="8" fill="#2c2c2e" />
        <g transform="translate(6, 5) scale(0.66)"><path fill="#FFF" fill-rule="evenodd" d="M12 2C6.5 2 2 6.5 2 12c0 4.4 2.9 8.2 6.8 9.5.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.3-3.4-1.3-.5-1.1-1.1-1.4-1.1-1.4-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 3 .8.1-.6.3-1.1.6-1.4-2.2-.2-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 0 1 5 0c2-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.8-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 22 12c0-5.5-4.5-10-10-10z"/></g>
        <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f5f5f7">GitHub</text>
      </g>
    </g>
  </g>
</svg>