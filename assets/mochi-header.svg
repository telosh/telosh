<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="mochi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="50%" stop-color="#131722" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="mochi-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="33%" stop-color="#38bdf8" />
      <stop offset="66%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="mochi-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
  </defs>

  <rect width="800" height="220" rx="24" fill="url(#bg)" stroke="url(#mochi-border)" stroke-width="2" />

  <!-- App Window Bar -->
  <path d="M 0 24 A 24 24 0 0 1 24 0 L 776 0 A 24 24 0 0 1 800 24 L 800 40 L 0 40 Z" fill="#262338" opacity="0.8" />
  
  <!-- Window Dot Indicators -->
  <circle cx="28" cy="20" r="5" fill="#f472b6" opacity="0.8" />
  <circle cx="44" cy="20" r="5" fill="#38bdf8" opacity="0.8" />
  <circle cx="60" cy="20" r="5" fill="#34d399" opacity="0.8" />
  <text x="80" y="24" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">telosh.view</text>

  <!-- Main Greeting Banner -->
  <g transform="translate(48, 64)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#312e81" opacity="0.6" stroke="#6366f1" stroke-width="1" />
    <text x="16" y="17" font-family="ui-rounded, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1">ENGINEERING SPACE</text>

    <text x="0" y="64" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', sans-serif" font-size="36" font-weight="800" fill="url(#mochi-text)">Terumi Kawano (telosh)</text>

    <text x="0" y="92" font-family="ui-rounded, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">Frontend &amp; Mobile Native  /  Google Cloud &amp; Infrastructure</text>

    <text x="0" y="118" font-family="ui-rounded, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Crafting fluid web &amp; mobile user experiences with modern software architecture.</text>
  </g>
</svg>