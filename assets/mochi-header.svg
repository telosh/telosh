<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="100%" height="100%">
  <defs>
    <!-- Mochi Pastel Background Gradient -->
    <linearGradient id="mochi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="50%" stop-color="#131722" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Soft Gradient -->
    <linearGradient id="mochi-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="33%" stop-color="#38bdf8" />
      <stop offset="66%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Text Soft Glow -->
    <linearGradient id="mochi-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
  </defs>

  <!-- Outer Card with Large Soft Rounded Corners -->
  <rect width="800" height="230" rx="24" fill="url(#mochi-bg)" stroke="url(#mochi-border)" stroke-width="2" />

  <!-- App Window Bar (もちふわブラウザヘッダー) -->
  <path d="M 0 24 A 24 24 0 0 1 24 0 L 776 0 A 24 24 0 0 1 800 24 L 800 40 L 0 40 Z" fill="#262338" opacity="0.8" />
  
  <!-- Window Control Buttons (もちふわドット) -->
  <circle cx="28" cy="20" r="6" fill="#f87171" />
  <circle cx="46" cy="20" r="6" fill="#fbbf24" />
  <circle cx="64" cy="20" r="6" fill="#34d399" />
  <text x="88" y="24" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">telosh-app.view 🌸</text>

  <!-- Main Greeting Banner -->
  <g transform="translate(48, 68)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#312e81" opacity="0.6" stroke="#6366f1" stroke-width="1" />
    <text x="16" y="18" font-family="ui-rounded, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">✨ WELCOME TO MY SPACE</text>

    <!-- Name Title -->
    <text x="0" y="70" font-family="ui-rounded, -apple-system, BlinkMacSystemFont, 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', sans-serif" font-size="36" font-weight="800" fill="url(#mochi-text)">Terumi Kawano (telosh)</text>

    <!-- Subtitle -->
    <text x="0" y="98" font-family="ui-rounded, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">📱 Frontend &amp; Mobile Native  •  ☁️ Google Cloud &amp; Edge Engineering</text>

    <!-- Short Bio -->
    <text x="0" y="124" font-family="ui-rounded, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">心地よく・もちもち動くWeb &amp; モバイルアプリケーションをつくっています 🌸</text>
  </g>
</svg>